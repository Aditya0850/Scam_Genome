[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustlens"
version = "0.1.0"
description = "TrustLens - URL and message threat classification engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "dnspython",
    "cryptography",
    "tldextract",
    "idna",
    "rapidfuzz",
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/trustlens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
